name: 1 · Build data and statistics

# One pass over the whole data side: the nomination spreadsheet, the published
# schema.org file and its statistics out.
#
# The order is fixed by what each step reads:
#
#   1. restructure_impactful_datasets.py   spreadsheet -> RDF working graph
#   2. build_website.py                    working graph -> schema.org file (+ site)
#   3. analyze_graph.py                    schema.org file -> statistics, diagram
#
# Step 2 also writes the site, because the site is built from the same records in
# the same pass. Workflow 2 previews it; workflow 3 proposes it to AGU.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where to build from"
        type: choice
        required: true
        default: "data/source"
        options:
          - data/source     # the CSV committed in this repository
          - zenodo          # the record's concept DOI, always its latest version
          - custom          # whatever is put in source_ref below
      source_ref:
        description: "Used only when source is 'custom': a path, an http(s) URL, or a Zenodo DOI"
        required: false
        default: ""
      base_url:
        description: "Address the site is served from"
        required: true
        default: "https://data.agu.org/impactful-datasets/"
      allow_new_ids:
        description: "Permit new identifiers — expected only when datasets are added"
        type: boolean
        default: false
      commit:
        description: "Commit the results back to the branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt is what makes `cache: pip` above work: setup-python
      # builds its cache key from a dependency file, and fails the step if there
      # is none to hash.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The committed CSV is the default, so a run builds from something already
      # reviewed and in the repository rather than from whatever a remote record
      # holds at the moment the job starts. Selecting `zenodo` builds from the
      # record's concept DOI, which always resolves to its newest version.
      - name: Check the inputs
        run: |
          test -f assets/AGU_Logo_H_CMYK.png || echo "::warning::No logo; the header will render empty."
          test -f data/source/person_review.csv || echo "::warning::No data/source/person_review.csv; parties without an ORCID all default to agu:ResponsibleParty."
          case "${{ inputs.source }}" in
            zenodo)      echo "Building from the Zenodo record's concept DOI (latest version)" ;;
            data/source) echo "Building from the spreadsheet committed in data/source/" ;;
            custom)
              if [ -z "${{ inputs.source_ref }}" ]; then
                echo "::error::source is 'custom' but source_ref is empty."
                exit 1
              fi
              echo "Building from ${{ inputs.source_ref }}" ;;
          esac

      # The published data file is also the identifier registry. Seeding it is
      # what keeps every dataset URL stable across rebuilds.
      - name: Seed the identifier registry
        run: |
          mkdir -p build/data
          if [ -f site/data/impactful_datasets.data.jsonld ]; then
            cp site/data/impactful_datasets.data.jsonld build/data/
            echo "Seeded $(python -c "import json;print(len([n for n in json.load(open('build/data/impactful_datasets.data.jsonld'))['@graph'] if n.get('@type')=='Dataset']))") existing identifiers"
          else
            echo "::warning::No existing data file. Every identifier will be minted fresh — correct only on a first run."
          fi

      - name: 1 — Spreadsheet to RDF
        run: |
          case "${{ inputs.source }}" in
            zenodo)      python scripts/restructure_impactful_datasets.py --zenodo -o build ;;
            data/source) python scripts/restructure_impactful_datasets.py -o build ;;
            custom)      python scripts/restructure_impactful_datasets.py "${{ inputs.source_ref }}" -o build ;;
          esac

      - name: 2 — RDF to schema.org
        run: |
          python scripts/build_website.py build/impactful_datasets.jsonld \
            --logo assets/AGU_Logo_H_CMYK.png \
            --feature-image assets/story-feature-source.jpg \
            --base-url "${{ inputs.base_url }}" \
            -o build | tee build.log

      # A rebuild that reissues identifiers has broken every published URL. Catch
      # it here rather than after it is live.
      - name: Guard against renumbered identifiers
        run: |
          MINTED=$(grep -o '[0-9]\+ new id' build.log | head -1 | grep -o '[0-9]\+')
          MINTED=${MINTED:-0}
          echo "identifiers minted this run: $MINTED"
          if [ "$MINTED" -gt 0 ] && [ "${{ inputs.allow_new_ids }}" != "true" ]; then
            echo "::error::$MINTED identifiers were minted. If datasets were genuinely added, re-run with allow_new_ids. If not, the registry was not seeded and every existing URL would break."
            exit 1
          fi

      - name: 3 — Statistics from the published file
        run: |
          python scripts/analyze_graph.py build/data/impactful_datasets.data.jsonld -o build
          python scripts/document_schema_model.py build/data/impactful_datasets.data.jsonld \
            -o build/schema_model.svg

      - name: Summarise
        run: |
          python - <<'PY'
          import json, os
          s = json.load(open("build/graph_statistics.json"))
          col = json.load(open("build/column_statistics.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Data and statistics rebuilt\n\n")
              src = col.get("source", {})
              if src.get("source") == "zenodo":
                  fh.write(f"- source: Zenodo `{src.get('file')}`, version DOI "
                           f"[`{src.get('version_doi')}`](https://doi.org/{src.get('version_doi')})\n")
              elif src.get("url"):
                  fh.write(f"- source: {src['url']}\n")
              else:
                  fh.write(f"- source: `{src.get('path')}`\n")
              fh.write(f"- rows read: **{col['rows']}**, encoding repairs: **{col['encoding_repairs']}**\n")
              fh.write(f"- triples published: **{s['triples']:,}**\n\n")
              fh.write("| | |\n|---|---|\n")
              fh.write(f"| Datasets | **{s['datasets']}** |\n")
              fh.write(f"| Nominators | **{s['nominators']}** |\n")
              fh.write(f"| Nominations | **{s['nominations']}** |\n")
              fh.write(f"| Discipline groups | **{s['discipline_groups']}** |\n\n")
              fh.write("### Datasets per discipline group\n\n| Group | Datasets |\n|---|---|\n")
              for d in s["disciplines"]:
                  fh.write(f"| {d['group']} | {d['datasets']} |\n")
              fh.write("\n### Classes\n\n| Class | Instances |\n|---|---|\n")
              for c in s["classes"]:
                  fh.write(f"| `{c['class']}` | {c['instances']} |\n")
          PY

      - name: Publish outputs
        run: |
          mkdir -p reports
          rm -rf site && mkdir -p site
          mkdir -p data/output
          cp build/impactful_datasets.jsonld data/output/
          cp -r build/index.html build/assets build/data site/
          cp build/column_report.md build/column_statistics.json \
             build/graph_statistics.md build/graph_statistics.json \
             build/conceptual_model.svg build/schema_model.svg \
             build/party_report.csv reports/

      - uses: actions/upload-artifact@v6
        with:
          name: data-and-statistics
          path: |
            data/output/impactful_datasets.jsonld
            site/
            reports/

      # Staged before the commit step and reported either way, so a run with
      # commit turned off still shows exactly what it would have changed.
      - name: List what changed
        run: |
          git add data/output/impactful_datasets.jsonld site/ reports/
          git diff --staged --name-status > /tmp/changed.txt || true
          if [ ! -s /tmp/changed.txt ]; then
            echo "CHANGED=0" >> $GITHUB_ENV
            echo "Nothing changed; the outputs already match the source."
            echo "## Files updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "None. The rebuild produced the same bytes that are already committed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "CHANGED=$(wc -l < /tmp/changed.txt)" >> $GITHUB_ENV
          cat /tmp/changed.txt
          python - <<'PY'
          import os, subprocess
          WORD = {"A": "added", "M": "modified", "D": "deleted",
                  "C": "copied", "T": "type changed"}
          rows = []
          for line in open("/tmp/changed.txt"):
              parts = line.rstrip("\n").split("\t")
              if len(parts) < 2:
                  continue
              code, path = parts[0], parts[-1]
              if code.startswith("R"):
                  what = "renamed"
              else:
                  what = WORD.get(code[0], code)
              size = ""
              if os.path.exists(path):
                  n = os.path.getsize(path)
                  size = f"{n/1024:.0f} KB" if n >= 1024 else f"{n} B"
              rows.append((what, path, size))
          committing = os.environ.get("COMMIT_ENABLED") == "true"
          head = "Files updated" if committing else "Files that would be updated"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"## {head}\n\n")
              if not committing:
                  fh.write("`commit` was off for this run, so nothing was pushed.\n\n")
              fh.write("| | File | Size |\n|---|---|---|\n")
              for what, path, size in sorted(rows, key=lambda r: r[1]):
                  fh.write(f"| {what} | `{path}` | {size} |\n")
              fh.write(f"\n{len(rows)} file{'s' if len(rows) != 1 else ''} in total.\n")
          PY
        env:
          COMMIT_ENABLED: ${{ inputs.commit }}

      - name: Commit
        if: ${{ inputs.commit && env.CHANGED != '0' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The version DOI goes in the commit message, so the history records
          # exactly which version of the record each rebuild came from.
          SRC=$(python -c "import json;s=json.load(open('reports/column_statistics.json'))['source'];print(s.get('version_doi') or s.get('url') or s.get('path') or 'unknown')")
          git commit -m "Rebuild data and statistics from $SRC"
          git push
          SHA=$(git rev-parse --short HEAD)
          echo "Pushed $SHA"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Committed as [\`$SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/$SHA)." >> $GITHUB_STEP_SUMMARY
