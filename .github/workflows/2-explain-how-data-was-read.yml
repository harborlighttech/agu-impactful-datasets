name: 2 · Explain how the data was read

# Produces a plain-language account of how the spreadsheet was interpreted, and
# prints it to the log so it can be read without downloading anything.
#
# Run it between building the data and previewing the site. Everything upstream
# of the site is guesswork of one kind or another -- which delimiter separates
# the names in a cell, whether a credited party is a person or an institution --
# and the guesses are right often enough that nobody would notice the wrong ones
# unless they were pointed at. This is the pointing.
#
# It writes two things to reports/ and prints a digest of both:
#
#   interpretation.md   how each column was read, and which were awkward
#   person_review.csv   every credited party, its assigned type, and why
#
# person_review.csv at the repository root is a different file: that one holds
# the reviewer's DECISION column and is an input to the build. This workflow
# never writes it, so a decision cannot be erased by running this.
on:
  workflow_dispatch:
    inputs:
      data_file:
        description: "Published data file to read"
        required: true
        default: "site/data/impactful_datasets.data.jsonld"
      commit:
        description: "Commit the report to reports/"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: explain-data
  cancel-in-progress: false

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the inputs
        run: |
          for f in "${{ inputs.data_file }}" reports/column_statistics.json data/cleanup/party_report.csv; do
            test -f "$f" || {
              echo "::error::Missing $f. Run '1 · Build data and statistics' first."
              exit 1
            }
          done

      - name: Classify the credited parties
        run: |
          mkdir -p reports
          python scripts/review_person_types.py "${{ inputs.data_file }}" \
            -o data/cleanup/person_review.csv

      - name: Write and print the interpretation report
        run: |
          python - <<'PY'
          import csv, collections, json, os, textwrap

          col = json.load(open("reports/column_statistics.json"))
          # Two different files, two different questions. party_report.csv says
          # how every credited party was actually typed; person_review.csv says
          # which ones looked doubtful and why.
          parties = list(csv.DictReader(open("data/cleanup/party_report.csv", encoding="utf-8-sig")))
          flagged = list(csv.DictReader(open("data/cleanup/person_review.csv", encoding="utf-8-sig")))
          stats = col["column_stats"]
          src = col.get("source", {})

          where = (f"Zenodo {src.get('version_doi')} — {src.get('file')}"
                   if src.get("source") == "zenodo"
                   else src.get("url") or src.get("path") or "unknown")

          # A cell holding several values had to be split somehow, and the method
          # is a guess. Commas are the unreliable one: "Jochum, Klaus Peter" is
          # one person and "A. Newman, M. Clark" is two, so those are flagged.
          shaky = [c for c in stats
                   if any("low confidence" in m for m in (c.get("methods") or {}))]
          sparse = [c for c in stats if c["fill_pct"] < 100]
          crowded = sorted(stats, key=lambda c: -c["max_values_in_cell"])[:5]
          repaired = col.get("encoding_repairs", 0)

          out = []
          w = out.append
          w("# How the spreadsheet was read\n")
          w(f"Source: **{where}** — {col['rows']} rows, {col['columns']} columns.\n")
          if repaired:
              w(f"The file is not valid UTF-8. **{repaired} bytes** were Mac Roman "
                "and were repaired before parsing; without that, the file cannot "
                "be opened at all.\n")

          w("## Columns that needed a judgement call\n")
          if shaky:
              w("A cell holding several values has to be split, and the separator "
                "is inferred. Semicolons and line breaks are unambiguous. Commas "
                "are not: `Jochum, Klaus Peter` is one person and "
                "`A. Newman, M. Clark` is two. These columns had cells split on a "
                "comma, and are the likeliest place for a wrong reading:\n")
              w("| Column | Cells split on a comma | Total cells |")
              w("|---|---|---|")
              for c in shaky:
                  n = sum(v for k, v in c["methods"].items() if "low confidence" in k)
                  w(f"| {c['column'][:60]} | **{n}** | {c['non_null']} |")
              w("")
          else:
              w("No column needed a comma-based split. Every multi-value cell used "
                "an unambiguous separator.\n")

          w("## Columns that are not fully populated\n")
          if sparse:
              w("Not an error, but worth knowing before quoting a total from them.\n")
              w("| Column | Filled |")
              w("|---|---|")
              for c in sorted(sparse, key=lambda c: c["fill_pct"]):
                  w(f"| {c['column'][:60]} | {c['fill_pct']}% |")
              w("")
          else:
              w("Every column is fully populated.\n")

          w("## Cells holding the most values\n")
          w("One cell held this many separate values. Large numbers are usually "
            "correct and simply unwieldy, but they are where a mis-split would "
            "hide.\n")
          w("| Column | Most values in one cell |")
          w("|---|---|")
          for c in crowded:
              w(f"| {c['column'][:60]} | {c['max_values_in_cell']} |")
          w("")

          by = collections.Counter((p["assigned_type"], p["confidence"]) for p in parties)
          rules = collections.Counter(p["rule"] for p in parties)
          w("## Who gets credited, and how confidently\n")
          w(f"{len(parties)} distinct credited parties. Where the evidence supports "
            "it they are typed as a person or an organisation; where it does not, "
            "they are typed `agu:ResponsibleParty`, which says the party is "
            "responsible for the dataset without claiming to know which.\n")
          w("| Type | High | Medium | Low |")
          w("|---|---|---|---|")
          for t in ("Person", "Organization", "agu:ResponsibleParty"):
              w(f"| {t} | {by[(t,'high')]} | {by[(t,'medium')]} | {by[(t,'low')]} |")
          w("")
          low = [p for p in parties if p["confidence"] == "low"]
          if low:
              w(f"**{len(low)} parties were typed on weak evidence.** These are the "
                "rows most worth a human glance; `data/cleanup/person_review.csv` has "
                "the reasoning for every one.\n")
          fix = [p for p in flagged if p["suggested_action"] == "split first"]
          drop = [p for p in flagged if p["suggested_action"] == "re-parse or drop"]
          if fix or drop:
              w("## Entries that no amount of typing will fix\n")
              if fix:
                  w(f"- **{len(fix)}** cells hold several entities in one string, "
                    "such as a person and their institution together. They need "
                    "splitting upstream, not reclassifying.")
              if drop:
                  w(f"- **{len(drop)}** are not entities at all: a sentence or a "
                    "fragment that landed in a name field. Giving these a formal "
                    "type would be worse than leaving them.")
              w("")
              w("Both are artifacts of the original spreadsheet, and both are "
                "listed in `data/cleanup/person_review.csv`.\n")

          report = "\n".join(out)
          open("reports/interpretation.md", "w", encoding="utf-8").write(report)

          # to the log, so it can be read without downloading anything
          print()
          print(report)
          print()
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(report)
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: interpretation
          path: |
            reports/interpretation.md
            data/cleanup/person_review.csv

      - name: Commit
        if: ${{ inputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/interpretation.md data/cleanup/person_review.csv
          git diff --staged --quiet && echo "report unchanged" && exit 0
          git commit -m "Refresh the interpretation report"
          git push
