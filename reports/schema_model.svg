<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="660" viewBox="0 0 1330 660" role="img">
<title>Conceptual model of the published Impactful Datasets schema.org graph</title>
<desc>A nomination is a schema.org EndorseAction whose agent is the nominator, whose object is the dataset, and whose result is the justification, itself tagged with impact dimensions. Datasets carry discipline terms as keywords, sit in repository catalogs, cite publications and reuse examples, and credit parties as creator or curator. Ordering is explicit: the collection lists its datasets and each dataset lists its nominators as RDF lists.</desc>
