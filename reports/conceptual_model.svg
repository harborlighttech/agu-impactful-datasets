<svg xmlns="http://www.w3.org/2000/svg" width="680" height="348" viewBox="0 0 680 348" role="img">
<title>Conceptual model of the published Impactful Datasets data</title>
<desc>A nomination is a schema.org EndorseAction: its agent is the nominator, its object the dataset, and its result the justification, tagged with impact dimensions. Datasets carry discipline terms as keywords and sit in repository catalogs.</desc>
<style>.bx{stroke-width:.5}.t{font:14px sans-serif}.th{font:500 14px sans-serif}.ts{font:12px sans-serif}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.f-teal{fill:#E1F5EE;stroke:#0F6E56}.t-teal{fill:#085041}.s-teal{fill:#0F6E56}.f-purple{fill:#EEEDFE;stroke:#534AB7}.t-purple{fill:#3C3489}.s-purple{fill:#534AB7}.f-coral{fill:#FAECE7;stroke:#993C1D}.t-coral{fill:#712B13}.s-coral{fill:#993C1D}.f-gray{fill:#F1EFE8;stroke:#5F5E5A}.t-gray{fill:#444441}.s-gray{fill:#5F5E5A}.el{font:9px sans-serif;fill:#5F5E5A}.elh{font:9px sans-serif;fill:none;stroke:#fff;stroke-width:3px;stroke-linejoin:round}@media (prefers-color-scheme:dark){.el{fill:#B4B2A9}.elh{stroke:#1B1B19}.arr{stroke:#B4B2A9}.f-teal{fill:#085041;stroke:#9FE1CB}.t-teal{fill:#9FE1CB}.s-teal{fill:#5DCAA5}.f-purple{fill:#3C3489;stroke:#CECBF6}.t-purple{fill:#CECBF6}.s-purple{fill:#AFA9EC}.f-coral{fill:#712B13;stroke:#F5C4B3}.t-coral{fill:#F5C4B3}.s-coral{fill:#F0997B}.f-gray{fill:#444441;stroke:#D3D1C7}.t-gray{fill:#D3D1C7}.s-gray{fill:#B4B2A9}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bx f-teal" x="40" y="40" width="175" height="56" rx="8"/><text class="th t-teal" x="128" y="60" text-anchor="middle" dominant-baseline="central">Person</text><text class="ts s-teal" x="128" y="78" text-anchor="middle" dominant-baseline="central">168 nominators</text>
<rect class="bx f-purple" x="252" y="40" width="176" height="56" rx="8"/><text class="th t-purple" x="340" y="60" text-anchor="middle" dominant-baseline="central">EndorseAction</text><text class="ts s-purple" x="340" y="78" text-anchor="middle" dominant-baseline="central">174 nominations</text>
<rect class="bx f-purple" x="465" y="40" width="175" height="56" rx="8"/><text class="th t-purple" x="552" y="60" text-anchor="middle" dominant-baseline="central">CreativeWork</text><text class="ts s-purple" x="552" y="78" text-anchor="middle" dominant-baseline="central">161 justifications</text>
<rect class="bx f-teal" x="40" y="140" width="175" height="56" rx="8"/><text class="th t-teal" x="128" y="160" text-anchor="middle" dominant-baseline="central">Organization</text><text class="ts s-teal" x="128" y="178" text-anchor="middle" dominant-baseline="central">145 affiliations</text>
<rect class="bx f-coral" x="252" y="140" width="176" height="56" rx="8"/><text class="th t-coral" x="340" y="160" text-anchor="middle" dominant-baseline="central">Dataset</text><text class="ts s-coral" x="340" y="178" text-anchor="middle" dominant-baseline="central">133 datasets</text>
<rect class="bx f-purple" x="465" y="140" width="175" height="56" rx="8"/><text class="th t-purple" x="552" y="160" text-anchor="middle" dominant-baseline="central">DefinedTerm</text><text class="ts s-purple" x="552" y="178" text-anchor="middle" dominant-baseline="central">51 impact tags</text>
<rect class="bx f-coral" x="40" y="240" width="175" height="56" rx="8"/><text class="th t-coral" x="128" y="260" text-anchor="middle" dominant-baseline="central">DefinedTerm</text><text class="ts s-coral" x="128" y="278" text-anchor="middle" dominant-baseline="central">9 discipline groups</text>
<rect class="bx f-coral" x="252" y="240" width="176" height="56" rx="8"/><text class="th t-coral" x="340" y="260" text-anchor="middle" dominant-baseline="central">DataCatalog</text><text class="ts s-coral" x="340" y="278" text-anchor="middle" dominant-baseline="central">110 repositories</text>
<rect class="bx f-gray" x="465" y="240" width="175" height="56" rx="8"/><text class="th t-gray" x="552" y="260" text-anchor="middle" dominant-baseline="central">ResponsibleParty</text><text class="ts s-gray" x="552" y="278" text-anchor="middle" dominant-baseline="central">308 unresolved parties</text>
