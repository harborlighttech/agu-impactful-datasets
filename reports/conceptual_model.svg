<svg xmlns="http://www.w3.org/2000/svg" width="680" height="348" viewBox="0 0 680 348" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Conceptual model of the published Impactful Datasets data</title>
<desc>A nomination is a schema.org EndorseAction: its agent is the nominator, its object the dataset, and its result the justification, which is tagged with impact dimensions. Datasets carry discipline terms as keywords and sit in repository catalogs. Parties that resolve to neither a person nor an organization are typed ResponsibleParty.</desc>
<style>.bx{stroke-width:.5}.t{font:14px sans-serif}.th{font:500 14px sans-serif}.ts{font:12px sans-serif}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.f-teal{fill:#E1F5EE;stroke:#0F6E56}.t-teal{fill:#085041}.s-teal{fill:#0F6E56}.f-purple{fill:#EEEDFE;stroke:#534AB7}.t-purple{fill:#3C3489}.s-purple{fill:#534AB7}.f-coral{fill:#FAECE7;stroke:#993C1D}.t-coral{fill:#712B13}.s-coral{fill:#993C1D}.f-gray{fill:#F1EFE8;stroke:#5F5E5A}.t-gray{fill:#444441}.s-gray{fill:#5F5E5A}.el{font:9px sans-serif;fill:#5F5E5A}.elh{font:9px sans-serif;fill:none;stroke:#fff;stroke-width:3px;stroke-linejoin:round}@media (prefers-color-scheme:dark){.el{fill:#B4B2A9}.elh{stroke:#1B1B19}.arr{stroke:#B4B2A9}.f-teal{fill:#085041;stroke:#9FE1CB}.t-teal{fill:#9FE1CB}.s-teal{fill:#5DCAA5}.f-purple{fill:#3C3489;stroke:#CECBF6}.t-purple{fill:#CECBF6}.s-purple{fill:#AFA9EC}.f-coral{fill:#712B13;stroke:#F5C4B3}.t-coral{fill:#F5C4B3}.s-coral{fill:#F0997B}.f-gray{fill:#444441;stroke:#D3D1C7}.t-gray{fill:#D3D1C7}.s-gray{fill:#B4B2A9}}</style>
