<rect class="bx f-teal" x="40" y="140" width="175" height="56" rx="8"/><text class="th t-teal" x="128" y="160" text-anchor="middle" dominant-baseline="central">Organization</text><text class="ts s-teal" x="128" y="178" text-anchor="middle" dominant-baseline="central">144 affiliations</text>
